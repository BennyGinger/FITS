[project]
name = "fisch"
version = "5.0.0"
description = "Fluorescent Imaging and Single-cell Histories, or FIScH, is a Python package to analyze fluorescent microscopy images and track individual cells over time."
readme = "README.md"
authors = [
    { name = "Benoit Roux", email = "benoit.roux@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "scope-io>=3.0.0",
    "progress-bar",
    "ipython>=9.10.0",
    "pydantic>=2.12.5",
    "pyside6>=6.10.2",
    "pyqtgraph>=0.14.0",
    "typer>=0.23.0",
    "cellpose-kit",
    "cellpose[gui]<=4",
    "tracklink",
    "bg-sub",
    "stackalign",
    "tomlkit>=0.15.1",
    "mask-interpolation",
    "bioimagequant",
    "filelock>=3.20",
    "pyarrow>=20",
    "roifile>=2026.2.10",
    "micro-sam>=1.8.3",
    "mobile-sam",
    "psutil>=7.2.2",
]

# Windows accelerator profile; enabled by default below.
[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pyright>=1.1.414",
    "pytest>=9.0.2",
]
cuda129 = [
    "torch==2.8.0+cu129; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torchvision==0.23.0+cu129; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
fisch = "fisch.cli.main:main"
fisch-gui = "fisch.gui.main:main"
fisch-segtune = "fisch.gui.viewer.main:segtune"
fisch-regtune = "fisch.gui.viewer.main:regtune"
fisch-bgtune = "fisch.gui.viewer.main:bgtune"
fisch-trackedit = "fisch.gui.viewer.main:trackedit"
fisch-drawmask = "fisch.gui.viewer.main:drawmask"
fisch-trackviewer = "fisch.gui.viewer.main:trackviewer"
fisch-channel-labels = "fisch.gui.channel_labels.main:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "cuda129"]
constraint-dependencies = [
    "torch==2.10.0; sys_platform == 'linux'",
    "torchvision==0.25.0; sys_platform == 'linux'",
]

[tool.uv.workspace]
members = [
    "scope_io",
    "progress_bar",
    "cellpose_kit",
    "tracklink",
    "bg_sub",
    "stackalign",
    "mask_interpolation",
    "bioimagequant",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu129", group = "cuda129", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchvision = [
    { index = "pytorch-cu129", group = "cuda129", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
scope-io = { workspace = true }
progress-bar = { workspace = true }
cellpose-kit = { workspace = true }
tracklink = { workspace = true }
bg-sub = { workspace = true }
stackalign = { workspace = true }
mask-interpolation = { workspace = true }
bioimagequant = { workspace = true }
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }
micro-sam = { path = "micro-sam-headless", editable = true }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129/"
explicit = true

[tool.pytest.ini_options]
testpaths = [
  "scope_io/tests",
  "progress_bar/tests",
  "tests",
]
pythonpath = [
  "src",
  "scope_io/src",
  "progress_bar/src"
]
