[project]
name = "fits"
version = "2.1.0"
description = "Fluorescent Image Tracking Software, or FITS, is a Python package to analyze fluorescent microscopy images and track individual cells over time."
readme = "README.md"
authors = [
    { name = "Benoit Roux", email = "benoit.roux@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "fits-io",
    "progress-bar",
    "ipython>=9.10.0",
    "pydantic>=2.12.5",
    "pyside6>=6.10.2",
    "pyqtgraph>=0.14.0",
    "typer>=0.23.0",
    "cellpose-kit",
    "cellpose[gui]<=4",
    "tracklink",
    "bg-sub",
    "stackalign",
    "tomlkit>=0.15.1",
    "mask-interpolation",
    "bioimagequant",
]

# Windows accelerator profiles; cuda126 is enabled by default below.
[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pytest>=9.0.2",
]
cpu = [
    "torch==2.10.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torchvision==0.25.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
cuda126 = [
    "torch==2.10.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torchvision==0.25.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
cuda128 = [
    "torch==2.10.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torchvision==0.25.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
fits = "fits.cli.main:main"
fits-gui = "fits.gui.main:main"
fits-viewer = "fits.gui.viewer.main:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "cuda126"]
conflicts = [
    [{ group = "cpu" }, { group = "cuda126" }, { group = "cuda128" }],
]

[tool.uv.workspace]
members = [
    "fits_io",
    "progress_bar",
    "cellpose_kit",
    "tracklink",
    "bg_sub",
    "stackalign",
    "mask_interpolation",
    "bioimagequant",
]

[tool.uv.sources]
# CUDA 12.6 retains support for Pascal GPUs such as the GTX 1080.
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu126", group = "cuda126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", group = "cuda128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu126", group = "cuda126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", group = "cuda128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
fits-io = { workspace = true }
progress-bar = { workspace = true }
cellpose-kit = { workspace = true }
tracklink = { workspace = true }
bg-sub = { workspace = true }
stackalign = { workspace = true }
mask-interpolation = { workspace = true }
bioimagequant = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = [
  "fits_io/tests",
  "progress_bar/tests",
  "tests",
]
pythonpath = [
  "src",
  "fits_io/src",
  "progress_bar/src"
]
